<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainer</title>
<style>
  :root{--bg:#0f1a2b;--card:#1b2a42;--text:#eef3fb;--muted:#9fb0c8;--accent:#ffb703}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
  main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  h1{font-size:40px;text-align:center} h1 span{color:var(--accent)}
  p{color:var(--muted);text-align:center}
  a.jeu{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:16px;
        padding:16px 18px;color:var(--text);text-decoration:none;font-size:20px;font-weight:600}
  a.jeu small{color:var(--muted);font-size:13px;font-weight:400}
</style>
</head>
<body>
<main>
  <h1>Brain<span>er</span></h1>
  <p>Aucun jeu publié pour l'instant.</p>
</main>
</body>
</html>
